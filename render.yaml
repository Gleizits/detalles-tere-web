# ------------------------------------------------------------
# Render Blueprint — DetallesTere (rama tpw)
#
# Render no ofrece runtime PHP: el servicio se construye con el
# Dockerfile de DetallesTerePHP/. La base de datos NO se crea aquí:
# es el mismo SQL Server 2019 Developer con DetallesTereDB.
#
# Crea el servicio desde este archivo y rellena DB_PASSWORD en el
# panel de Render (sync: false = nunca se versiona).
# ------------------------------------------------------------
services:
  - type: web
    name: detailstere-web
    runtime: docker
    branch: tpw
    plan: free
    dockerfilePath: ./DetallesTerePHP/Dockerfile
    dockerContext: ./DetallesTerePHP
    healthCheckPath: /login
    envVars:
      - key: DB_SERVER
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        value: DetallesTereDB
      - key: DB_USER
        value: sa
      - key: DB_PASSWORD
        sync: false
      - key: DB_TRUST_CERT
        value: "true"
      - key: DB_TIMEOUT
        value: "10"
      - key: APP_TIMEZONE
        value: America/Lima
      - key: APP_PRODUCTION
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_MINUTES
        value: "30"
